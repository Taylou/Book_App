{% extends "base.html" %}
{% block title %}Authors{% endblock %}

{% block content %}
<h1 class="text-center mb-5">Authors List</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
        </tr>
    </thead>
    <tbody>
        {% for author in authors %}
        <tr><td>{{ author }}</td></tr>
        {% else %}
        <tr><td class="text-center text-muted">No authors found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
